name: ci

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated release tag to rebuild (unpublished releases only)
        required: true
        type: string

# A manual rebuild uses the workflow on main while building the immutable tag.
env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-check:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      # checkout can fetch the event's commit into the tag ref, dropping its
      # annotation. Restore the actual remote tag object before validating it.
      - name: Restore annotated release tag
        run: git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
      - name: Check exact SemVer tag, versions, lockfile and committed notes
        run: node release.mjs --check-tag "$RELEASE_TAG"
      - name: Require release commit on main
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true
      - name: Prepare platform runtime dependencies
        run: node scripts/setup-native-runtime.mjs
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV 'CARGO_TARGET_DIR=C:\t'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev xvfb dbus-x11
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os == 'Windows' && 'windows-debug-v2' || 'native' }}
          cache-on-failure: true
          # Workspace target paths are relative; C:\t must be cached explicitly.
          workspaces: . -> target
          cache-targets: ${{ runner.os != 'Windows' }}
          cache-directories: ${{ runner.os == 'Windows' && env.CARGO_TARGET_DIR || '' }}
      - run: node --test scripts/*.test.mjs
      - run: cargo build --workspace --locked
      - if: runner.os != 'Windows'
        run: cargo test --workspace --locked
      # Native runtime diagnostics on Windows can abort the test process before
      # libtest prints the active test. Run serially without output capture so
      # every test still runs and a native failure can be identified in the log.
      - if: runner.os == 'Windows'
        run: cargo test --workspace --locked -- --test-threads=1 --nocapture
      - run: python scripts/package-app.py --profile dev --skip-build
      - if: runner.os == 'Linux'
        run: xvfb-run cargo test --locked -p plume-app --lib tray::linux::tests::hidden_window_can_be_mapped_again -- --ignored
      - if: runner.os == 'Linux'
        run: dbus-run-session cargo test --locked -p plume-app --lib tray::linux::tests::missing_tray_host_refuses_background_mode -- --ignored
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo fmt --check
  installers:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [release-check, build, lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true
      - name: Prepare platform runtime dependencies
        run: node scripts/setup-native-runtime.mjs
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV 'CARGO_TARGET_DIR=C:\t'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev patchelf
      - if: runner.os == 'Linux'
        name: Allow initial runtime lookup during packaging
        run: echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,$ORIGIN' >> "$GITHUB_ENV"
      - if: runner.os == 'macOS'
        name: Allow initial runtime lookup and Mach-O relocation
        run: echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,@loader_path -C link-arg=-Wl,-headerpad_max_install_names' >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os == 'Windows' && 'windows-release-v2' || 'native' }}
          cache-on-failure: true
          # Workspace target paths are relative; C:\t must be cached explicitly.
          workspaces: . -> target
          cache-targets: ${{ runner.os != 'Windows' }}
          cache-directories: ${{ runner.os == 'Windows' && env.CARGO_TARGET_DIR || '' }}
      - if: runner.os == 'Windows'
        name: Install Inno Setup
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.4.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe' -OutFile $setup
          if ((Get-AuthenticodeSignature -LiteralPath $setup).Status -ne 'Valid') {
            throw 'The Inno Setup publisher signature could not be verified'
          }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'inno-setup'
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', ('/DIR="' + $compilerDir + '"')) -WindowStyle Hidden -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Inno Setup installation failed: $($install.ExitCode)" }
          $compiler = Join-Path $compilerDir 'ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler is missing' }
          Add-Content $env:GITHUB_ENV "ISCC=$compiler"
      - run: cargo build --locked --release -p plume-app -p plume-updater
      - name: Bundle runtimes, build installers, verify installation and checksum
        run: node scripts/package-release.mjs
      - if: runner.os == 'macOS'
        name: Verify disk image and app replacement with native fixtures
        env:
          PLUME_DMG_TEST: '1'
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          # Manual rebuilds may fix CI fixtures without changing the release tag.
          # Load only the test from the immutable workflow revision; its imports
          # and the already-built product still come from the release checkout.
          git fetch --no-tags --depth=1 origin "$WORKFLOW_SHA"
          git show "$WORKFLOW_SHA:scripts/macos-dmg.test.mjs" > scripts/.macos-dmg-ci.test.mjs
          node --test scripts/.macos-dmg-ci.test.mjs
          rm scripts/.macos-dmg-ci.test.mjs
          cargo test --locked -p plume-updater
      - if: runner.os == 'Linux'
        name: Install Debian package and verify registered application
        run: |
          sudo apt-get install -y ./dist/Plume-*.deb
          /usr/bin/plume --version
          sudo apt-get remove -y plume
      - if: runner.os == 'macOS'
        name: Copy macOS app from disk image and verify application in Applications
        run: |
          mount="$RUNNER_TEMP/plume-dmg"
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount" dist/Plume-*.dmg
          trap 'hdiutil detach "$mount"' EXIT
          test "$(readlink "$mount/Applications")" = /Applications
          test -f "$mount/.DS_Store"
          ditto "$mount/Plume.app" /Applications/Plume.app
          codesign --verify --deep --strict /Applications/Plume.app
          /Applications/Plume.app/Contents/MacOS/plume --version
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error
          overwrite: true
  draft:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [release-check, build, lint, installers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Restore release tag and recheck main ancestry before creating or refreshing the draft
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
      - name: Create or refresh draft (published releases are refused)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: GITHUB_REF_NAME="$RELEASE_TAG" GITHUB_SHA="$(git rev-parse HEAD)" node scripts/publish-release.mjs
