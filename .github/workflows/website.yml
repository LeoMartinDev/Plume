name: Website

# Cloudflare Pages builds and deploys the site from the repo on its own
# (root directory: website/). This workflow only asks Cloudflare to rebuild
# when a release is published, so the download buttons point at the new installers.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::CLOUDFLARE_DEPLOY_HOOK is not set; skipping the website rebuild."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
