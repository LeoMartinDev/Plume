[package]
name = "plume-overlay"
version = "0.1.7"
edition = "2021"
# Linux gpui links -lxkbcommon-x11. CI needs the Debian/Ubuntu package
# libxkbcommon-x11-dev. Do not commit an unversioned .so symlink.

[dependencies]
tracing.workspace = true
plume-core = { path = "../plume-core" }
plume-ui = { path = "../plume-ui" }
gpui = "=0.2.2"
arboard = "3.6"

[dev-dependencies]
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13.2"
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
