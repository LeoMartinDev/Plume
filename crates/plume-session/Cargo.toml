[package]
name = "plume-session"
version = "0.1.5"
edition = "2021"

[dependencies]
plume-logging = { path = "../plume-logging" }
tracing.workspace = true
plume-core = { path = "../plume-core" }
plume-engine = { path = "../plume-engine" }
plume-audio = { path = "../plume-audio" }
plume-inject = { path = "../plume-inject" }
plume-hotkey = { path = "../plume-hotkey" }
plume-overlay = { path = "../plume-overlay" }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
