[package]
name = "plume-updater"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "plume-updater"
path = "src/main.rs"

[dependencies]
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
