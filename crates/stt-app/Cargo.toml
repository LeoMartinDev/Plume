[package]
name = "stt-app"
version = "0.1.0"
edition = "2021"

[dependencies]
arboard = "3.6"
dirs = "6"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stt-engine = { path = "../stt-engine" }
stt-overlay = { path = "../stt-overlay" }
stt-session = { path = "../stt-session" }
stt-ui = { path = "../stt-ui" }
toml = "0.8"
ureq = "3"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
] }
