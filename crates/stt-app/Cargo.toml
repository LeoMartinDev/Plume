[package]
name = "stt-app"
version = "0.1.0"
edition = "2021"

[dependencies]
dirs = "6"
gpui = "=0.2.2"
serde = { version = "1", features = ["derive"] }
stt-engine = { path = "../stt-engine" }
stt-overlay = { path = "../stt-overlay" }
stt-session = { path = "../stt-session" }
stt-ui = { path = "../stt-ui" }
toml = "0.8"
ureq = "3"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
] }
